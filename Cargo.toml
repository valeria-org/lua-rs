[package]
name = "luajit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "LuaJIT 2.1 runtime in Rust with Lua 5.4 and Luau syntax trees"
repository = "https://github.com/valeria-org/lua-rs"
readme = "README.md"

[lib]
name = "luajit"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "luajit"
path = "src/main.rs"

[dependencies]
libc = "0.2"
full_moon = { version = "3.0", features = ["lua54", "luau"] }

[profile.release]
debug = 1
panic = "unwind"
lto = "fat"
codegen-units = 1
