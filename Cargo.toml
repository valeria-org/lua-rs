[package]
name = "luajit"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A re-implementation of LuaJIT 2.1 (interpreter, standard library and FFI) in Rust"
repository = "https://github.com/valeria-org/lua-rs"
readme = "README.md"

[lib]
name = "luajit"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "luajit"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
debug = 1
panic = "unwind"
lto = "fat"
codegen-units = 1
